<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Your Anong Ulam Today shopping list."
  >

  <title>
    Shopping | Anong Ulam Today?
  </title>


  <script type="module" crossorigin src="/assets/shopping-OQZp-ZaS.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/storage-D1nLyvOY.js">
  <link rel="stylesheet" crossorigin href="/assets/storage-CkZu_Zf1.css">
</head>


<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header class="site-header">

    <div
      class="
        container
        site-header__inner
      "
    >

      <button
        class="icon-button"
        type="button"
        aria-label="Open menu"
      >
        ☰
      </button>


      <a
        class="site-title"
        href="/"
      >
        Anong
        <span>Ulam</span>
        Today?
      </a>


      <button
        class="icon-button"
        type="button"
        aria-label="Favorites"
      >
        ♡
      </button>

    </div>

  </header>


  <!-- =========================
       MAIN
  ========================== -->

  <main class="site-main">

    <div class="container">


      <!-- PAGE TITLE -->

      <section class="page-heading">

        <h1 class="page-heading__title">
          🛒 Shopping List
        </h1>

        <p class="page-heading__subtitle">
          Everything you need for your next grocery run.
        </p>

      </section>


      <!-- =========================
           ADD ITEM
      ========================== -->

      <section class="shopping-add-card">

        <div class="shopping-add-card__title">
          <span>➕</span>

          <div>
            <strong>Add an item</strong>

            <small>
              Add anything, even if it isn't in the Pantry list.
            </small>
          </div>
        </div>


        <form
          class="shopping-add-form"
          id="shoppingAddForm"
        >

          <input
            class="shopping-add-input"
            id="shoppingItemName"
            type="text"
            placeholder="Example: Paper towels"
            maxlength="80"
            autocomplete="off"
            required
          >


          <button
            class="
              btn
              shopping-add-button
            "
            type="submit"
          >
            Add
          </button>

        </form>

      </section>


      <!-- =========================
           TOOLS
      ========================== -->

      <section class="shopping-toolbar">

        <label class="search-field">

          <span class="search-field__icon">
            🔍
          </span>

          <input
            id="shoppingSearch"
            type="search"
            placeholder="Search shopping list..."
            autocomplete="off"
          >

        </label>


        <div class="shopping-actions">

          <button
            class="shopping-action-button"
            id="undoButton"
            type="button"
            disabled
          >
            ↶ Undo
          </button>


          <button
            class="shopping-action-button"
            id="redoButton"
            type="button"
            disabled
          >
            ↷ Redo
          </button>


          <button
            class="
              shopping-action-button
              shopping-action-button--danger
            "
            id="clearShoppingButton"
            type="button"
          >
            Clear
          </button>

        </div>

      </section>


      <!-- =========================
           COUNTER
      ========================== -->

      <section class="shopping-summary">

        <strong id="shoppingCount">
          0 items
        </strong>

        <span>
          Check “Have” without removing it from Shopping.
        </span>

      </section>


      <!-- =========================
           SHOPPING LIST
      ========================== -->

      <section
        class="shopping-list"
        id="shoppingList"
      >
      </section>

    </div>

  </main>


  <!-- =========================
       BOTTOM NAV
  ========================== -->

  <nav class="bottom-nav">

    <a
      class="bottom-nav__item"
      href="/"
    >
      <span class="bottom-nav__icon">
        🍳
      </span>

      <span>
        Ulam
      </span>
    </a>


    <a
      class="bottom-nav__item"
      href="/pantry.html"
    >
      <span class="bottom-nav__icon">
        🧺
      </span>

      <span>
        Pantry
      </span>
    </a>


    <a
      class="
        bottom-nav__item
        is-active
      "
      href="/shopping.html"
    >
      <span class="bottom-nav__icon">
        🛒
      </span>

      <span>
        Shopping
      </span>
    </a>

  </nav>



</body>

</html>
