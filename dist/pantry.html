<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Manage the ingredients you currently have at home."
  >

  <title>
    Pantry | Anong Ulam Today?
  </title>


  <script type="module" crossorigin src="/assets/pantry-CfL0mHbG.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/storage-D1nLyvOY.js">
  <link rel="stylesheet" crossorigin href="/assets/storage-CkZu_Zf1.css">
</head>


<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header class="site-header">

    <div
      class="
        container
        site-header__inner
      "
    >

      <button
        class="icon-button"
        type="button"
        aria-label="Open menu"
      >
        ☰
      </button>


      <a
        class="site-title"
        href="/"
      >
        Anong
        <span>Ulam</span>
        Today?
      </a>


      <button
        class="icon-button"
        type="button"
        aria-label="Favorites"
      >
        ♡
      </button>

    </div>

  </header>


  <!-- =========================
       MAIN
  ========================== -->

  <main class="site-main">

    <div class="container">


      <!-- =========================
           PAGE HEADING
      ========================== -->

      <section class="page-heading">

        <h1 class="page-heading__title">
          🧺 Your Pantry
        </h1>

        <p class="page-heading__subtitle">
          Check the ingredients you already have at home.
        </p>

      </section>


      <!-- =========================
           SEARCH
      ========================== -->

      <section class="pantry-tools">

        <label class="search-field">

          <span class="search-field__icon">
            🔍
          </span>

          <input
            id="pantrySearch"
            type="search"
            placeholder="Search ingredients..."
            autocomplete="off"
          >

        </label>


        <label class="pantry-available-toggle">

          <input
            id="showAvailableOnly"
            type="checkbox"
          >

          <span>
            Show only what I have
          </span>

        </label>

      </section>


      <!-- =========================
           PANTRY INFO
      ========================== -->

      <section class="pantry-info-card">

        <span class="pantry-info-card__icon">
          💡
        </span>

        <div>

          <strong>
            How this works
          </strong>

          <p>
            Check an ingredient when you have it.
            You can still add any ingredient to your
            Shopping List whenever you need more.
          </p>

        </div>

      </section>


      <!-- =========================
           PANTRY LIST
      ========================== -->

      <section
        class="pantry-list"
        id="pantryList"
      >
      </section>

    </div>

  </main>


  <!-- =========================
       MOBILE BOTTOM NAV
  ========================== -->

  <nav class="bottom-nav">


    <!-- ULAM -->

    <a
      class="bottom-nav__item"
      href="/"
    >

      <span class="bottom-nav__icon">
        🍳
      </span>

      <span>
        Ulam
      </span>

    </a>


    <!-- PANTRY -->

    <a
      class="
        bottom-nav__item
        is-active
      "
      href="/pantry.html"
    >

      <span class="bottom-nav__icon">
        🧺
      </span>

      <span>
        Pantry
      </span>

    </a>


    <!-- SHOPPING -->

    <a
      class="bottom-nav__item"
      href="/shopping.html"
    >

      <span class="bottom-nav__icon">
        🛒
      </span>

      <span>
        Shopping
      </span>

    </a>

  </nav>



</body>

</html>
