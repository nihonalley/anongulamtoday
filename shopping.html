<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Your Anong Ulam Today shopping list."
  >

  <title>
    Shopping | Anong Ulam Today?
  </title>

  <link
    rel="stylesheet"
    href="/css/master.css"
  >

  <link
    rel="stylesheet"
    href="/css/responsive.css"
  >
</head>


<body>

  <!-- HEADER -->

  <header
    class="site-header"
  >

    <div
      class="
        container
        site-header__inner
      "
    >

      <button
        class="icon-button"
        type="button"
        aria-label="Open menu"
      >
        ☰
      </button>


      <a
        class="site-title"
        href="/"
      >
        Anong
        <span>Ulam</span>
        Today?
      </a>


      <button
        class="icon-button"
        type="button"
        aria-label="Favorites"
      >
        ♡
      </button>

    </div>

  </header>


  <!-- MAIN -->

  <main
    class="site-main"
  >

    <div
      class="container"
    >


      <!-- PAGE HEADING -->

      <section
        class="page-heading"
      >

        <h1
          class="page-heading__title"
        >
          🛒 Shopping List
        </h1>

        <p
          class="page-heading__subtitle"
        >
          Check items you already have
          and remove them when you
          no longer need to buy them.
        </p>

      </section>


      <!-- TOOLS -->

      <section
        class="shopping-tools"
      >

        <label
          class="search-field"
        >

          <span
            class="search-field__icon"
          >
            🔍
          </span>

          <input
            id="shoppingSearch"
            type="search"
            placeholder="Search shopping list..."
            autocomplete="off"
          >

        </label>


        <button
          class="shopping-clear"
          id="clearShoppingButton"
          type="button"
        >
          Clear Shopping List
        </button>

      </section>


      <!-- SHOPPING LIST -->

      <section
        class="shopping-list"
        id="shoppingList"
      >
      </section>


    </div>

  </main>


  <!-- MOBILE NAV -->

  <nav
    class="bottom-nav"
  >

    <a
      class="bottom-nav__item"
      href="/"
    >
      <span
        class="bottom-nav__icon"
      >
        🍳
      </span>

      <span>
        Ulam
      </span>
    </a>


    <a
      class="bottom-nav__item"
      href="/pantry.html"
    >
      <span
        class="bottom-nav__icon"
      >
        🧺
      </span>

      <span>
        Pantry
      </span>
    </a>


    <a
      class="
        bottom-nav__item
        is-active
      "
      href="/shopping.html"
    >
      <span
        class="bottom-nav__icon"
      >
        🛒
      </span>

      <span>
        Shopping
      </span>
    </a>

  </nav>


  <script
    type="module"
    src="/js/shopping.js"
  ></script>

</body>

</html>
